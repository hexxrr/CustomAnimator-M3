
name: Build

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version_name: ${{ steps.version.outputs.name }}
      version_code: ${{ steps.version.outputs.code }}
      signed: ${{ steps.keystore.outputs.signed }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Compute version
        id: version
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          code=$((200 + GITHUB_RUN_NUMBER))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "Building $name ($code)"

      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No signing secrets available; the release APK will be unsigned."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build debug, release and TV debug
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleDebug :app:assembleRelease :app:assembleTvDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Collect APKs
        run: |
          set -e
          mkdir -p dist
          base="CustomAnimator-M3-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}"

          find app/build/outputs/apk -type f -name '*.apk' -print

          mobile_debug="app/build/outputs/apk/debug/app-debug.apk"
          tv_debug="app/build/outputs/apk/tv/debug/app-tv-debug.apk"

          if [ ! -f "$mobile_debug" ]; then
            echo "Mobile debug APK not found"
            exit 1
          fi

          if [ ! -f "$tv_debug" ]; then
            echo "TV debug APK not found. Available APKs:"
            find app/build/outputs/apk -type f -name '*.apk' -print
            exit 1
          fi

          cp "$mobile_debug" "dist/$base-debug.apk"
          cp "$tv_debug" "dist/$base-tv-debug.apk"

          release=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)

          if [ -z "$release" ]; then
            echo "Release APK not found"
            exit 1
          fi

          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            cp "$release" "dist/$base.apk"
          else
            cp "$release" "dist/$base-unsigned.apk"
          fi

          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh dist

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CustomAnimator-M3-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: CustomAnimator-M3-${{ needs.build.outputs.version_name }}-${{ needs.build.outputs.version_code }}
          path: dist

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build.outputs.version_name }}-${{ needs.build.outputs.version_code }}
          target_commitish: ${{ github.sha }}
          name: Custom Animator M3 ${{ needs.build.outputs.version_name }} (build ${{ needs.build.outputs.version_code }})
          generate_release_notes: true
          make_latest: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
