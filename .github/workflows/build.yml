
name: Build

on:
  push:
    branches:
      - tv-build
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Mobile and TV APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build APKs
        run: |
          ./gradlew :app:assembleDebug :app:assembleRelease :app:assembleTvDebug --stacktrace

      - name: Collect APKs
        run: |
          set -e
          mkdir -p dist

          find app/build/outputs/apk -type f -name '*.apk' -print

          cp app/build/outputs/apk/debug/app-debug.apk dist/CustomAnimator-Mobile-Debug.apk

          tv_apk="app/build/outputs/apk/tv/debug/app-tv-debug.apk"

          if [ ! -f "$tv_apk" ]; then
            echo "TV APK not found. Actual APK files:"
            find app/build/outputs/apk -type f -name '*.apk' -print
            exit 1
          fi

          cp "$tv_apk" dist/CustomAnimator-TV-Debug.apk

          release=$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n1)

          if [ -n "$release" ]; then
            cp "$release" dist/CustomAnimator-Mobile-Release.apk
          fi

          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh dist

      - uses: actions/upload-artifact@v7
        with:
          name: CustomAnimator-M3-TV-Build
          path: dist/
          if-no-files-found: error
